name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

# Cancel superseded runs for the same ref (branch / PR / tag) on new pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ---- gate: build + vet + test -----------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: go vet ./...
      - run: go build ./...
      - run: go test -count=1 ./...

  # ---- images: build the four images and publish to GHCR ----------------
  images:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: momos-clone
            dockerfile: images/clone/Dockerfile
          - name: momos-reviewer
            dockerfile: images/reviewer/Dockerfile
          - name: momos-publisher
            dockerfile: images/publisher/Dockerfile
          - name: momos
            dockerfile: images/momos/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # Fork PRs get a read-only token and cannot push to GHCR; build only.
      - name: Decide whether to push
        id: push
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && \
             [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.push.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          # main -> latest ; PR -> pr-<number> ; release -> the release tag.
          # A short-sha tag is always added for traceability.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=pr-${{ github.event.number }},enable=${{ github.event_name == 'pull_request' }}
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=sha,format=short

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # Multi-arch on main/releases; amd64-only on PRs for faster feedback.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ steps.push.outputs.enabled == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # ---- chart: lint, package, and publish the Helm chart to GHCR (OCI) ----
  chart:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint deploy/helm/momos

      - name: Compute chart version and image tag
        id: ver
        run: |
          base="$(grep '^version:' deploy/helm/momos/Chart.yaml | awk '{print $2}')"
          case "${{ github.event_name }}" in
            release)
              raw="${{ github.event.release.tag_name }}"
              v="${raw#v}"      # chart version: strict SemVer2 (no leading v)
              imgtag="$raw" ;;  # image tag: exactly what the images job pushed
            *)
              if [ "${{ github.ref }}" = "refs/heads/main" ]; then
                v="${base}-main.$(git rev-parse --short HEAD)"
                imgtag="latest"
              else
                v="${base}-pr.${{ github.event.number }}"
                imgtag="pr-${{ github.event.number }}"
              fi ;;
          esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "imgtag=$imgtag" >> "$GITHUB_OUTPUT"

      - name: Package chart
        run: |
          # Point the packaged chart at the matching image tag.
          sed -i 's|^  tag: .*|  tag: "${{ steps.ver.outputs.imgtag }}"|' deploy/helm/momos/values.yaml
          helm package deploy/helm/momos \
            --version "${{ steps.ver.outputs.version }}" \
            --app-version "${{ steps.ver.outputs.imgtag }}" \
            --destination dist

      # Publish on main and releases. PRs (and forks) only lint/package.
      - name: Log in to GHCR (Helm OCI)
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Push chart to OCI
        if: github.event_name != 'pull_request'
        run: |
          # OCI references must be lowercase; the org is "Hades-Scheduler".
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          helm push "dist/momos-${{ steps.ver.outputs.version }}.tgz" \
            "oci://${{ env.REGISTRY }}/$owner/charts"

  # ---- deploy: ship the Momos service to the test VM behind Traefik ------
  # Mirrors the Hades repo's deployment. Requires a `momos-test` environment
  # with:
  #   vars:    VM_HOST, VM_USERNAME, DEPLOYMENT_GATEWAY_HOST,
  #            DEPLOYMENT_GATEWAY_USER, DEPLOYMENT_GATEWAY_PORT,
  #            MOMOS_HOST (public hostname for Momos),
  #            HADES_API_HOST (public hostname of the Hades API on the same VM)
  #   secrets: VM_SSH_PRIVATE_KEY, DEPLOYMENT_GATEWAY_SSH_KEY,
  #            MOMOS_TOKEN_SECRET, HADES_AUTH_KEY, GH_WEBHOOK_SECRET,
  #            GH_TOKEN, LLM_API_KEY
  # Traefik (shared, `traefik` external network) must already run on the VM —
  # the Hades deployment brings it up.
  deploy:
    needs: [images, chart]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: momos-test
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "image_tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage deployment bundle
        run: |
          mkdir -p bundle/prompts
          cp deploy/docker-compose.test.yml bundle/docker-compose.test.yml
          cp deploy/config.example.yaml     bundle/config.yaml
          cp prompts/*.md                   bundle/prompts/

      - name: Copy deployment files to VM
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          proxy_host: ${{ vars.DEPLOYMENT_GATEWAY_HOST }}
          proxy_username: ${{ vars.DEPLOYMENT_GATEWAY_USER }}
          proxy_key: ${{ secrets.DEPLOYMENT_GATEWAY_SSH_KEY }}
          proxy_port: ${{ vars.DEPLOYMENT_GATEWAY_PORT }}
          timeout: 2m
          source: "bundle"
          target: /opt/momos
          strip_components: 1

      - name: Create .env on VM
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          proxy_host: ${{ vars.DEPLOYMENT_GATEWAY_HOST }}
          proxy_username: ${{ vars.DEPLOYMENT_GATEWAY_USER }}
          proxy_key: ${{ secrets.DEPLOYMENT_GATEWAY_SSH_KEY }}
          proxy_port: ${{ vars.DEPLOYMENT_GATEWAY_PORT }}
          script: |
            install -m 600 /dev/null /opt/momos/.env
            cat > /opt/momos/.env <<EOF
            IMAGE_TAG=${{ steps.tag.outputs.image_tag }}
            MOMOS_HOST=${{ vars.MOMOS_HOST }}
            HADES_URL=https://${{ vars.HADES_API_HOST }}
            HADES_LOGMANAGER_URL=
            MOMOS_EXTERNAL_URL=https://${{ vars.MOMOS_HOST }}
            EOF

      - name: Deploy with docker compose
        uses: appleboy/ssh-action@v1.2.5
        env:
          # Secrets go through the process environment (bare-key compose entries)
          # so Compose does not $-interpolate values that may contain '$'.
          MOMOS_TOKEN_SECRET: ${{ secrets.MOMOS_TOKEN_SECRET }}
          HADES_AUTH_KEY: ${{ secrets.HADES_AUTH_KEY }}
          GH_WEBHOOK_SECRET: ${{ secrets.GH_WEBHOOK_SECRET }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          proxy_host: ${{ vars.DEPLOYMENT_GATEWAY_HOST }}
          proxy_username: ${{ vars.DEPLOYMENT_GATEWAY_USER }}
          proxy_key: ${{ secrets.DEPLOYMENT_GATEWAY_SSH_KEY }}
          proxy_port: ${{ vars.DEPLOYMENT_GATEWAY_PORT }}
          envs: MOMOS_TOKEN_SECRET,HADES_AUTH_KEY,GH_WEBHOOK_SECRET,GH_TOKEN,LLM_API_KEY
          script: |
            cd /opt/momos
            docker compose -f docker-compose.test.yml up --pull=always -d --remove-orphans
            docker image prune -af --filter "until=24h"
