name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

# Cancel superseded runs for the same ref (branch / PR / tag) on new pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ---- gate: build + vet + test -----------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: go vet ./...
      - run: go build ./...
      - run: go test -count=1 ./...

  # ---- images: build the four images and publish to GHCR ----------------
  images:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: momos-clone
            dockerfile: images/clone/Dockerfile
          - name: momos-reviewer
            dockerfile: images/reviewer/Dockerfile
          - name: momos-publisher
            dockerfile: images/publisher/Dockerfile
          - name: momos
            dockerfile: images/momos/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # Fork PRs get a read-only token and cannot push to GHCR; build only.
      - name: Decide whether to push
        id: push
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && \
             [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.push.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          # main -> latest ; PR -> pr-<number> ; release -> the release tag.
          # A short-sha tag is always added for traceability.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=pr-${{ github.event.number }},enable=${{ github.event_name == 'pull_request' }}
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=sha,format=short

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # Multi-arch on main/releases; amd64-only on PRs for faster feedback.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ steps.push.outputs.enabled == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # ---- chart: lint, package, and publish the Helm chart to GHCR (OCI) ----
  chart:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint deploy/helm/momos

      - name: Compute chart version and image tag
        id: ver
        run: |
          base="$(grep '^version:' deploy/helm/momos/Chart.yaml | awk '{print $2}')"
          case "${{ github.event_name }}" in
            release)
              raw="${{ github.event.release.tag_name }}"
              v="${raw#v}"      # chart version: strict SemVer2 (no leading v)
              imgtag="$raw" ;;  # image tag: exactly what the images job pushed
            *)
              if [ "${{ github.ref }}" = "refs/heads/main" ]; then
                v="${base}-main.$(git rev-parse --short HEAD)"
                imgtag="latest"
              else
                v="${base}-pr.${{ github.event.number }}"
                imgtag="pr-${{ github.event.number }}"
              fi ;;
          esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "imgtag=$imgtag" >> "$GITHUB_OUTPUT"

      - name: Package chart
        run: |
          # Point the packaged chart at the matching image tag.
          sed -i 's|^  tag: .*|  tag: "${{ steps.ver.outputs.imgtag }}"|' deploy/helm/momos/values.yaml
          helm package deploy/helm/momos \
            --version "${{ steps.ver.outputs.version }}" \
            --app-version "${{ steps.ver.outputs.imgtag }}" \
            --destination dist

      # Publish on main and releases. PRs (and forks) only lint/package.
      - name: Log in to GHCR (Helm OCI)
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Push chart to OCI
        if: github.event_name != 'pull_request'
        run: |
          # OCI references must be lowercase; the org is "Hades-Scheduler".
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          helm push "dist/momos-${{ steps.ver.outputs.version }}.tgz" \
            "oci://${{ env.REGISTRY }}/$owner/charts"

  # ---- deploy: helm upgrade against the Kubernetes cluster ---------------
  # Requires a `production` environment with ONE secret:
  #   KUBECONFIG  — base64-encoded kubeconfig scoped to the momos namespace
  #                 (create with: base64 -w0 < kubeconfig)
  # The app secrets are NOT here — they live in the in-cluster `momos-secrets`
  # Secret referenced by deploy/values-prod.yaml (existingSecret). Runs on main
  # pushes, releases, and workflow_dispatch; never on PRs.
  deploy:
    needs: [images, chart]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: azure/setup-kubectl@v4

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "image_tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync app secrets into the cluster
        env:
          MOMOS_TOKEN_SECRET: ${{ secrets.MOMOS_TOKEN_SECRET }}
          HADES_AUTH_KEY: ${{ secrets.HADES_AUTH_KEY }}
          GH_WEBHOOK_SECRET: ${{ secrets.GH_WEBHOOK_SECRET }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GH_APP_KEY: ${{ secrets.GH_APP_KEY }}
        run: |
          kubectl create namespace momos --dry-run=client -o yaml | kubectl apply -f -
          # The App key must reach Momos base64-encoded (single line, so it
          # survives ${ENV} substitution). Normalize whether the GitHub secret
          # holds a raw PEM or already-base64.
          key="$GH_APP_KEY"
          if printf '%s' "$key" | grep -q "BEGIN"; then
            key="$(printf '%s' "$GH_APP_KEY" | base64 -w0)"
          fi
          kubectl -n momos create secret generic momos-secrets \
            --from-literal=MOMOS_TOKEN_SECRET="$MOMOS_TOKEN_SECRET" \
            --from-literal=HADES_AUTH_KEY="$HADES_AUTH_KEY" \
            --from-literal=GH_WEBHOOK_SECRET="$GH_WEBHOOK_SECRET" \
            --from-literal=LLM_API_KEY="$LLM_API_KEY" \
            --from-literal=GH_APP_KEY="$key" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy
        run: |
          helm upgrade --install momos deploy/helm/momos \
            --namespace momos --create-namespace \
            -f deploy/values-prod.yaml \
            --set image.tag=${{ steps.tag.outputs.image_tag }} \
            --wait --timeout 5m
          # Force a re-pull of a moving :latest tag (a no-op for unique release tags).
          kubectl -n momos rollout restart deploy/momos-momos
          kubectl -n momos rollout status  deploy/momos-momos --timeout=180s
