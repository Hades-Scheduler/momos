# Momos test deployment (VM + shared Traefik), deployed by the `deploy` job in
# .github/workflows/ci.yml — mirrors the Hades repo's deployment.
#
# Traefik (the shared ls1intum reverse proxy, `traefik` external network) must
# already be running on the VM — it is brought up by the Hades deployment on the
# same host. Momos joins that network to get a public HTTPS hostname, which both
# the GitHub webhook and the Hades job callbacks need.
services:
  momos:
    image: ghcr.io/hades-scheduler/momos:${IMAGE_TAG:-latest}
    command: ["-config", "/etc/momos/config.yaml", "-prompts", "/etc/momos/prompts", "-db", "/data/momos.db"]
    networks:
      - traefik
    environment:
      # Endpoints + non-secret config come from .env (safe to interpolate).
      - HADES_URL=${HADES_URL}
      - HADES_LOGMANAGER_URL=${HADES_LOGMANAGER_URL:-}
      - MOMOS_EXTERNAL_URL=${MOMOS_EXTERNAL_URL}
      # Secrets use the bare-key form so Compose passes them through from the
      # process environment WITHOUT $VAR interpolation (which would mangle values
      # containing '$'). The deploy step forwards these via `envs:`.
      - MOMOS_TOKEN_SECRET
      - HADES_AUTH_KEY
      - GH_WEBHOOK_SECRET
      - GH_TOKEN
      - LLM_API_KEY
    volumes:
      - ./config.yaml:/etc/momos/config.yaml:ro
      - ./prompts:/etc/momos/prompts:ro
      - momos-data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.momos.rule=Host(`${MOMOS_HOST}`)"
      - "traefik.http.routers.momos.entrypoints=websecure"
      - "traefik.http.routers.momos.tls.certresolver=harica"
      - "traefik.http.services.momos.loadbalancer.server.port=8080"
    restart: unless-stopped

networks:
  traefik:
    external: true

volumes:
  momos-data:
