apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "momos.fullname" . }}-config
  labels:
    {{- include "momos.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- .Values.config | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "momos.fullname" . }}-prompts
  labels:
    {{- include "momos.labels" . | nindent 4 }}
data:
{{- range $name, $content := .Values.prompts }}
  {{ $name }}: |
    {{- $content | nindent 4 }}
{{- end }}
