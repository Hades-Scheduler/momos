apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "momos.fullname" . }}
  labels:
    {{- include "momos.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "momos.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ .Values.config | sha256sum }}
      labels:
        {{- include "momos.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: momos
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "-config=/etc/momos/config.yaml"
            - "-prompts=/etc/momos/prompts"
            - "-db=/data/momos.db"
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: {{ include "momos.secretName" . }}
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/momos/config.yaml
              subPath: config.yaml
            - name: prompts
              mountPath: /etc/momos/prompts
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: {{ include "momos.fullname" . }}-config
        - name: prompts
          configMap:
            name: {{ include "momos.fullname" . }}-prompts
        - name: data
        {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "momos.fullname" . }}-data
        {{- else }}
          emptyDir: {}
        {{- end }}
{{- if .Values.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "momos.fullname" . }}-data
  labels:
    {{- include "momos.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
